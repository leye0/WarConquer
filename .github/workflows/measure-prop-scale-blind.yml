name: Equipment · blind source-image proportions (Flash-Lite)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-prop-scale-blind.yml'
      - 'assets/experiments/props/marches_hache/trellis-v1/grip-scale-blind-request-v6.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warconquer-prop-source-only-scale-v6
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow to resize the original concept images
        run: python -m pip install 'Pillow==11.3.0'
      - name: Check strict exclusion of previously scaled equipment and images
        run: |
          python -m py_compile scripts/measure-prop-scale-blind.py scripts/test-measure-prop-scale-blind.py
          python scripts/test-measure-prop-scale-blind.py
          python scripts/measure-prop-scale-blind.py --check
      - name: One inexpensive, source-only vision inference (no retries)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/measure-prop-scale-blind.py
      - name: Verify source-only proposal and print actual billed cost
        run: |
          python scripts/measure-prop-scale-blind.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/experiments/props/marches_hache/trellis-v1/grip-scale-blind-v6.json')
          j=json.loads(p.read_text())
          print('Source-only projected proportion:',j['scale_estimate']['projected_length_ratio'])
          print('Preferred size:',j['scale_estimate']['preferred_length_ratio'])
          print('Independent human/visual QA needed:',j['scale_estimate']['manual_review_required'])
          print('OpenRouter actual cost USD:',j['observed_cost_usd'])
          PY
      - name: Archive paid analysis and token costs even if scale ambiguous
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for filename in grip-scale-blind-v6.json grip-scale-blind-v6-response.json; do
            full="assets/experiments/props/marches_hache/trellis-v1/$filename"
            if test -f "$full"; then git add -- "$full"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets: archive blind source-art equipment measurements and billed tokens'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Bundle original images for independent visual inspection
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/prop-source-preview"
          cp assets/concepts/marches/units/hache.png "$RUNNER_TEMP/prop-source-preview/unit-original.png"
          cp assets/concepts/marches/objects/hache_arme.png "$RUNNER_TEMP/prop-source-preview/object-original.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-prop-source-only-v6
          path: |
            assets/experiments/props/marches_hache/trellis-v1/grip-scale-blind-v6.json
            assets/experiments/props/marches_hache/trellis-v1/grip-scale-blind-v6-response.json
            ${{ runner.temp }}/prop-source-preview/
          retention-days: 7
          if-no-files-found: ignore
