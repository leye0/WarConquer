name: Character Lab · real Mixamo axe clips and source-image UV atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mixamo-playable.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warconquer-real-mixamo-playable
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare lightweight real-FBX conversion tools
        run: |
          python -m pip install 'Pillow==11.3.0'
          npm install --no-save --no-audit --no-fund 'fbx2gltf@0.9.7-p1'
          chmod +x node_modules/fbx2gltf/bin/Linux/FBX2glTF
          test -x node_modules/fbx2gltf/bin/Linux/FBX2glTF
      - name: Retrieve actual archived Mixamo axe clips into temporary workspace
        run: python scripts/convert-mixamo-fbx.py download "$RUNNER_TEMP/warconquer-mixamo"
      - name: Convert Mixamo FBX animations to GLB using FBX2glTF
        run: |
          python scripts/convert-mixamo-fbx.py convert "$RUNNER_TEMP/warconquer-mixamo"
          for clip in 2hand_Idle Walking_21 Run_With_Sword Standing_Melee_Attack_Downward; do
            test -s "$RUNNER_TEMP/warconquer-mixamo/$clip.glb"
          done
      - name: Retarget Mixamo 52-bone clips and diagnose source arm rest poses
        env:
          MIXAMO_CONVERTED_DIR: "${{ runner.temp }}/warconquer-mixamo"
        run: |
          python -m py_compile scripts/build-mixamo-playable.py
          python scripts/build-mixamo-playable.py
      - name: Preserve one skinned four-clip textured GLB on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/experiments/rig-ready-3d/marches_hache/tpose-v2/motion/mixamo-axe-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: four real Mixamo axe clips on WarConquer textured rig'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warconquer-mixamo-axe-playable
          path: assets/experiments/rig-ready-3d/marches_hache/tpose-v2/motion/mixamo-axe-v1/
          retention-days: 5
          if-no-files-found: ignore
