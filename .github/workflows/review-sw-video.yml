name: SW video · frame inspection (no new generation)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-sw-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-sw-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled video decoder and Pillow, no apt
        run: python -m pip install 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
      - name: Decode previous MP4 and build 8 review frames (no OpenRouter calls)
        run: python scripts/review-sw-video.py
      - name: Commit contact sheet and job metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/experiments/video-sw/contact-sheet.jpg assets/experiments/video-sw/job.json
          if ! git diff --cached --quiet; then
            git commit -m 'art: publish 8 video frames for SW motion review'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
