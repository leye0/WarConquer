name: SW video · frame inspection (no new generation)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-sw-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-sw-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Install Pillow for contact-sheet generation
        run: python -m pip install 'Pillow==11.3.0'
      - name: Inspect previously generated MP4 and produce 8 sampled frames
        run: python scripts/review-sw-video.py
      - name: Commit contact sheet and completed metadata directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/experiments/video-sw/contact-sheet.jpg assets/experiments/video-sw/job.json
          if ! git diff --cached --quiet; then
            git commit -m 'art: add visual frame inspection for existing SW video'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
