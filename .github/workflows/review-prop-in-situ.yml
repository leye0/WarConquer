name: Equipment · inexpensive vision critique without prior-scale anchoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-prop-in-situ.yml'
      - 'assets/experiments/props/marches_hache/trellis-v1/grip-render-review-request-v5.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warconquer-axe-in-situ-flash-lite-v5
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image resizing dependency; no 3D generation
        run: python -m pip install 'Pillow==11.3.0'
      - name: Check input images, model identity, source prompt and Python syntax offline
        run: |
          python -m py_compile scripts/review-prop-in-situ.py scripts/test-review-prop-unanchored.py
          python scripts/test-review-prop-unanchored.py
          python scripts/review-prop-in-situ.py --check
      - name: One paid multimodal reasoning pass (no retries), cache exact response and billing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/review-prop-in-situ.py
      - name: Verify generated plan and actual cost
        run: |
          python scripts/review-prop-in-situ.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/experiments/props/marches_hache/trellis-v1/grip-plan-v5.json')
          d=json.loads(p.read_text())
          assert d['schema']==4
          assert d['vision_model']=='google/gemini-2.5-flash-lite'
          print('LLM proposed object/character ratio:',d['specifications']['length_relative_character_height'])
          print('OpenRouter reported inference cost USD:',d.get('observed_cost_usd'))
          print('Billed token usage:',d.get('usage'))
          PY
      - name: Save paid response, cost and candidate even if validation failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/experiments/props/marches_hache/trellis-v1/grip-plan-v5.json
          git add -A assets/experiments/props/marches_hache/trellis-v1/grip-plan-v5-response.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: preserve low-cost unanchored Flash-Lite grip review and exact OpenRouter charge'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-equipment-flash-lite-v5
          path: |
            assets/experiments/props/marches_hache/trellis-v1/grip-plan-v5.json
            assets/experiments/props/marches_hache/trellis-v1/grip-plan-v5-response.json
          retention-days: 7
          if-no-files-found: ignore
