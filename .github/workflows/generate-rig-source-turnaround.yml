name: Rig-source turnaround · strict T-pose · OpenRouter Muse

on:
  push:
    branches: [main]
    paths:
      - 'rig-source-turnaround-request.json'
      - 'rig-source-turnaround-right-fix-request.json'
      - 'rig-source-profiles-v2-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marches-axeman-rig-source-tpose-v1
  cancel-in-progress: false

jobs:
  create-tpose-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Muse PNG processing dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.16.2'
      - name: Verify locked request and original WarConquer art without API charge
        run: |
          python -m py_compile scripts/generate-rig-source-turnaround.py
          python scripts/generate-rig-source-turnaround.py --dry-run
      - name: Generate up to four orthographic T-pose views with Muse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: |
          if [ -f rig-source-turnaround-right-fix-request.json ] || [ -f rig-source-profiles-v2-request.json ]; then
            echo "Later rig source trial selected; skip original paid image generation."
          else
            python scripts/generate-rig-source-turnaround.py
          fi
      - name: Apply the targeted right-side profile correction if requested
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: |
          if [ -f rig-source-turnaround-right-fix-request.json ] && [ ! -f rig-source-profiles-v2-request.json ]; then
            python -m py_compile scripts/fix-rig-source-right.py
            python scripts/fix-rig-source-right.py
          fi
      - name: Generate v2 orthographic profiles from stable 3D T-pose contract
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: |
          if [ -f rig-source-profiles-v2-request.json ]; then
            python -m py_compile scripts/generate-rig-profiles-v2.py
            python scripts/generate-rig-profiles-v2.py --dry-run
            python scripts/generate-rig-profiles-v2.py
          fi
      - name: Preserve successful views, warnings and review image on main
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d assets/experiments/rig-source-turnaround/marches_hache/tpose-v1 ]; then
            git add -A assets/experiments/rig-source-turnaround/marches_hache
            if ! git diff --cached --quiet; then
              git commit -m 'assets: publish strict T-pose Muse turnaround for human QA'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Summarize rig-source status
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## Strict T-pose four-view pilot' >> "$GITHUB_STEP_SUMMARY"
          if [ -f assets/experiments/rig-source-turnaround/marches_hache/tpose-v2/report.json ]; then
            python -m json.tool assets/experiments/rig-source-turnaround/marches_hache/tpose-v2/report.json >> "$GITHUB_STEP_SUMMARY"
          elif [ -f assets/experiments/rig-source-turnaround/marches_hache/tpose-v1/report.json ]; then
            python -m json.tool assets/experiments/rig-source-turnaround/marches_hache/tpose-v1/report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No image report produced; inspect failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw output and retained results for visual inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marches-axeman-muse-tpose-v1
          path: |
            rig-source-output/
            assets/experiments/rig-source-turnaround/marches_hache/
          if-no-files-found: ignore
          retention-days: 7
