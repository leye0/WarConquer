name: SW video v2 · preserve full axe swing
on:
  push:
    branches: [main]
    paths: ['video-sw-framed-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-sw-v2-safe
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg-equipped decoder and Pillow
        run: python -m pip install 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0' 'numpy==2.2.6'
      - name: Validate reference framing and no-cost request
        run: |
          python -m py_compile scripts/generate-sw-video-v2.py
          python scripts/generate-sw-video-v2.py --dry-run
      - name: Submit one low-cost video then extract and check frames
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate-sw-video-v2.py
      - name: Commit MP4, source still, sampled frames and job state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/experiments/video-sw-v2 ]]; then
            git add assets/experiments/video-sw-v2
            if ! git diff --cached --quiet; then
              git commit -m 'art: review wider-framed SW attack video v2'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
