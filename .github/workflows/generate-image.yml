name: Generate image · OpenRouter
on:
  push:
    branches: [main]
    paths: ['image-request.json']
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Subject description (empty = image-request.json batch)'
        type: string
        default: ''
      output:
        description: 'PNG path under assets/concepts/'
        type: string
        default: 'assets/concepts/custom/image.png'
      references:
        description: 'JSON array of existing PNG style-reference paths'
        type: string
        default: '["assets/concepts/couronne/units/archer.png"]'
permissions:
  contents: write
concurrency:
  group: image-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache rembg segmentation model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2netp-v1
      - name: Install image utilities
        run: python -m pip install 'Pillow==11.3.0' 'rembg[cpu]==2.0.67'
      - name: Generate with style references
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
          IMAGE_OUTPUT: ${{ inputs.output }}
          IMAGE_REFERENCES: ${{ inputs.references }}
          OMP_NUM_THREADS: '1'
        run: python scripts/generate-image.py
      - name: Commit generated assets directly to main
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/concepts
          if ! git diff --cached --quiet; then
            git commit -m 'art: add generated concept assets'
            # Integrate onto the latest main without rewriting history.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "Generated assets committed directly to main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: generated-images
          path: |
            image-output/
            assets/concepts/
          retention-days: 7
