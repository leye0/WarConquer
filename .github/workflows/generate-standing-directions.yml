name: Standing character turnaround · OpenRouter Muse
on:
  push:
    branches: [main]
    paths: ['standing-directions-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standing-turnaround
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG processing
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.16.2'
      - name: Validate exactly eight still images without charge
        run: |
          python -m py_compile scripts/generate-standing-directions.py
          python scripts/generate-standing-directions.py --dry-run
      - name: Generate still directions with Muse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: python scripts/generate-standing-directions.py
      - name: Commit generated PNGs and contact sheet to main even on partial success
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/experiments/standing-turnaround ]]; then
            git add assets/experiments/standing-turnaround
            if ! git diff --cached --quiet; then
              git commit -m 'art: add eight standing character directions from Muse'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: standing-turnaround-raw
          path: standing-output/
          retention-days: 2
          if-no-files-found: ignore
