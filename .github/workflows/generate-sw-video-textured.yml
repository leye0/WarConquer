name: SW video v3 · textured safety frame (one paid clip)
on:
  push:
    branches: [main]
    paths:
      - 'video-sw-textured-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-sw-textured-one-shot
  cancel-in-progress: false
jobs:
  test-sw:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and FFmpeg decoder
        run: python -m pip install 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0' 'numpy==2.2.6'
      - name: Compile and generate only the reference and locked request
        run: |
          python -m py_compile scripts/generate-sw-video-textured.py
          python scripts/generate-sw-video-textured.py prepare
      - name: Checkpoint image, prompt and unpaid reservation to main
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/experiments/video-sw-textured
          git commit -m 'art: reserve single SW framed video experiment'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Submit exactly one paid OpenRouter video job
        id: submit
        if: ${{ steps.claim.outcome == 'success' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate-sw-video-textured.py submit
      - name: Checkpoint accepted ID or ambiguous submission state immediately
        id: checkpoint_submit
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/experiments/video-sw-textured ]]; then
            git add assets/experiments/video-sw-textured
            if ! git diff --cached --quiet; then
              git commit -m 'art: checkpoint one SW video submit before polling'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Poll same job ID, download MP4 and analyze all 4fps samples
        if: ${{ steps.submit.outcome == 'success' && steps.checkpoint_submit.outcome == 'success' }}
        id: finish
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate-sw-video-textured.py finish
      - name: Commit MP4, 32 sampled frames, contact sheet, quality, model and cost
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/experiments/video-sw-textured ]]; then
            git add assets/experiments/video-sw-textured
            if ! git diff --cached --quiet; then
              git commit -m 'art: publish provisional SW textured-frame video and QA'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Summarize provisional result
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## SW textured-frame video (NOT APPROVED)' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f assets/experiments/video-sw-textured/job.json ]]; then
            python -c 'import json; j=json.load(open("assets/experiments/video-sw-textured/job.json")); print("Status:",j.get("status"),"Usage:",j.get("usage"),"Accepted ID:",j.get("id","none"))' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Human review of MP4 required; no paid retries.' >> "$GITHUB_STEP_SUMMARY"
