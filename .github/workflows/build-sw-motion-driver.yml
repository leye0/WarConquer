name: SW v4 · deterministic motion driver (zero API cost)
on:
  push:
    branches: [main]
    paths:
      - 'sw-motion-driver-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sw-motion-driver-v1
  cancel-in-progress: false
jobs:
  motion-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local renderer and FFmpeg binary
        run: python -m pip install 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
      - name: Compile and produce a deterministic 8s SW control video
        run: |
          python -m py_compile scripts/build-sw-motion-driver.py
          python scripts/build-sw-motion-driver.py
      - name: Commit videos, keypoints and geometric QA to main
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/experiments/sw-motion-driver-v1 ]]; then
            git add assets/experiments/sw-motion-driver-v1
            if ! git diff --cached --quiet; then
              git commit -m 'art: publish deterministic SW walk/attack motion blueprint'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Report no-cost geometry result
        if: ${{ always() }}
        run: |
          echo '## SW deterministic motion driver — no generative API' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f assets/experiments/sw-motion-driver-v1/metrics.json ]]; then
            python -c 'import json; j=json.load(open("assets/experiments/sw-motion-driver-v1/metrics.json")); print("Geometry:",j.get("status"),"Frames:",j.get("frames"),"Cost USD:",j.get("paid_cost_usd"))' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Driver failed, no video API was called.' >> "$GITHUB_STEP_SUMMARY"
          fi
