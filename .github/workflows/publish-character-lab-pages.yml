name: Character Lab · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'character-lab.html'
      - 'perception-lab.html'
      - 'scripts/arena-scene.js'
      - 'scripts/perception-brain.js'
      - 'scripts/resource-inventory.js'
      - 'scripts/perception-gait.js'
      - 'scripts/test-perception-gait.mjs'
      - 'scripts/perception-combat.js'
      - 'scripts/test-perception-combat.mjs'
      - 'scripts/test-resource-inventory.mjs'
      - 'scripts/perception-lab-client.js'
      - 'scripts/test-perception-brain.mjs'
      - 'scripts/test-grip-plan-selection.mjs'
      - 'scripts/character-lab-client.js'
      - 'scripts/weapon-grip-geometry.js'
      - 'scripts/rig-contact-landmarks.js'
      - 'scripts/test-rig-contact-landmarks.mjs'
      - 'scripts/equipment-animation-policy.js'
      - 'scripts/serve-character-lab.mjs'
      - 'scripts/build-character-lab-pages.mjs'
      - 'assets/experiments/rig-ready-3d/**'
      - 'assets/experiments/rig-source-turnaround/**'
      - 'assets/experiments/props/**'
      - 'assets/concepts/**'
      - 'data/units/**'
      - '.github/workflows/publish-character-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: character-lab-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate client and static exporter
        run: |
          node --check scripts/character-lab-client.js
          node --check scripts/arena-scene.js
          node --check scripts/perception-brain.js
          node --check scripts/resource-inventory.js
          node --check scripts/perception-gait.js
          node scripts/test-perception-gait.mjs
          node --check scripts/perception-combat.js
          node scripts/test-perception-combat.mjs
          node scripts/test-resource-inventory.mjs
          node --check scripts/perception-lab-client.js
          node scripts/test-perception-brain.mjs
          node --check scripts/weapon-grip-geometry.js
          node --check scripts/rig-contact-landmarks.js
          node scripts/test-rig-contact-landmarks.mjs
          node --check scripts/equipment-animation-policy.js
          node scripts/test-equipment-animation-policy.mjs
          node scripts/test-grip-plan-selection.mjs
          node --check scripts/serve-character-lab.mjs
          node --check scripts/build-character-lab-pages.mjs
      - name: Build minimal public Character Lab bundle
        run: node scripts/build-character-lab-pages.mjs "$RUNNER_TEMP/character-lab-pages"
      - name: Validate static catalog and bundled GLB
        env:
          PAGES_DIR: ${{ runner.temp }}/character-lab-pages
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync, existsSync } from "node:fs";
            import { join } from "node:path";
            const dir = process.env.PAGES_DIR;
            assert(existsSync(join(dir, "index.html")));
            assert(existsSync(join(dir, "scripts/character-lab-client.js")));
            assert(existsSync(join(dir, "perception-lab.html")));
            assert(existsSync(join(dir, "scripts/arena-scene.js")));
            assert(existsSync(join(dir, "scripts/perception-brain.js")));
            assert(existsSync(join(dir, "scripts/resource-inventory.js")));
            assert(existsSync(join(dir, "scripts/perception-gait.js")));
            assert(existsSync(join(dir, "scripts/perception-combat.js")));
            assert(existsSync(join(dir, "scripts/perception-lab-client.js")));
            assert(existsSync(join(dir, "scripts/weapon-grip-geometry.js")));
            assert(existsSync(join(dir, "scripts/rig-contact-landmarks.js")));
            assert(existsSync(join(dir, "scripts/equipment-animation-policy.js")));
            const data = JSON.parse(readFileSync(join(dir, "api/character-lab.json")));
            const props=data.characters.flatMap(c=>c.props||[]);
            assert(props.length>0,"No generic vision attachment plans discovered");
            for(const p of props) {
              const planPath=p.gripPlan.startsWith("/")?p.gripPlan.slice(1):p.gripPlan;
              const modelPath=p.model.startsWith("/")?p.model.slice(1):p.model;
              const plan=JSON.parse(readFileSync(join(dir,planPath)));
              assert([2,3,4].includes(plan.schema),"Invalid grip plan for "+p.id);
            if(plan.schema===3){
              assert(plan.source_provenance?.generation_brief_sha256,"Unprovenanced grip plan");
              assert(plan.scale_observation?.character_image_shows_full_object,"Scale not based on full character reference");
            }
              assert(existsSync(join(dir,modelPath)),"Missing prop "+p.id);
              if(p.physicalSize){
                const physicalPath=p.physicalSize.startsWith("/")?p.physicalSize.slice(1):p.physicalSize;
                const size=JSON.parse(readFileSync(join(dir,physicalPath)));
                assert(size.units==="cm" && size.estimated_length_cm>0,
                  "Invalid physical centimeter estimate");
              }
            }
            assert(data.characters.length > 0);
            const all = data.characters.flatMap(c => c.models);
            assert(all.some(m => m.name.includes("fal.ai") && m.kind === "playable"), "Missing default rigged warrior");
            const playable=all.filter(m=>m.kind==="playable");
            assert(playable.some(m=>{
              const modelPath=m.url.startsWith("/")?m.url.slice(1):m.url;
              const bytes=readFileSync(join(dir,modelPath));
              const length=bytes.readUInt32LE(12);
              const gltf=JSON.parse(bytes.subarray(20,20+length).toString("utf8"));
              return (gltf.animations||[]).some(a=>/attack/i.test(a.name||""));
            }),"No playable GLB contains an authentic attack animation");
            for (const m of all) {
              const p = join(dir, m.url.replace(/^\//, ""));
              assert(existsSync(p), "Missing model " + m.url);
              assert.equal(readFileSync(p).subarray(0,4).toString(), "glTF");
            }
            console.log("PASS: static catalog, playable GLB, entry point and assets");
          '
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/character-lab-pages
      - name: Publish Character Lab
        id: deployment
        uses: actions/deploy-pages@v4
