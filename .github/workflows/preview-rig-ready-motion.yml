name: Rig-ready motion · render animated mesh contact sheet

on:
  push:
    branches: [main]
    paths:
      - 'scripts/preview-rig-ready-motion.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software-renderer dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'Pillow==11.3.0'
      - name: Software skin and preview animation at five points
        run: |
          python -m py_compile scripts/preview-rig-ready-motion.py
          python scripts/preview-rig-ready-motion.py
      - name: Commit five-frame visual evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/experiments/rig-ready-3d/marches_hache/tpose-v2/motion/axe-chop-v1
          if ! git diff --cached --quiet; then
            git commit -m 'assets: capture animated warconquer mesh pose contact sheet'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
