name: Equipment · versioned multi-pass GLB vision pilot

on:
  push:
    branches: [feat/semantic-prop-contact-contract]
    paths:
      - '.github/workflows/semantic-spatial-pilot.yml'

permissions:
  contents: write

concurrency:
  group: wc-spatial-vision-pilot
  cancel-in-progress: false

jobs:
  annotate:
    if: contains(github.event.head_commit.message, '[spatial-pilot:marches_hache]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial rendering and zero-network test dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6'
      - name: Check no invented regions and named 3D contact labels
        run: |
          python scripts/test-prop-interaction-contract.py
          python scripts/test-prop-mesh-landmarks.py
          python scripts/test-prop-visual-qa.py
          python scripts/test-verify-prop-visual-qa.py
          node scripts/test-prop-motion-contact.mjs
      - name: Ground GLB points with exact coordinate grid and strict spatial schema
        run: |
          # Second Qwen reply localized named grips, but emitted four-number
          # BOXES for legacy two-number POINTS. The stronger schema prevents
          # this; visible panel ticks enable unambiguous mesh coordinates.
          # Immutable failed results and raw evidence remain inspectable.
          python scripts/prop-mesh-landmarks.py \
            --plan assets/experiments/props/marches_hache/trellis-v1/grip-plan.json \
            --pass-id qwen_grid_ticks --model qwen/qwen3-vl-235b-a22b-instruct
      - name: Preserve the GLB source-matched vision receipts and the canonical plan on the feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/experiments/props/marches_hache/trellis-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: capture real GLB regions and immutable OpenRouter vision receipt'
            git push origin HEAD:feat/semantic-prop-contact-contract
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-axe-glb-region-overlays
          path: |
            assets/experiments/props/marches_hache/trellis-v1/vision-landmarks-*.png
            assets/experiments/props/marches_hache/trellis-v1/vision-input-*.png
            assets/experiments/props/marches_hache/trellis-v1/vision-landmark-receipts/*.json
            assets/experiments/props/marches_hache/trellis-v1/grip-plan.json
          if-no-files-found: ignore
          retention-days: 7
