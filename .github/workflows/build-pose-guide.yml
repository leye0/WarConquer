name: Pose guide · deterministic animation control
on:
  push:
    branches: [main]
    paths:
      - 'pose-guide-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pose-guide
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic rendering dependencies
        run: python -m pip install 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
      - name: Render pose guide and verify motion geometry
        run: |
          python -m py_compile scripts/build-pose-guide.py
          python scripts/build-pose-guide.py
      - name: Publish guide media, control points, and QA on main
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/experiments/pose-guides
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish deterministic pose guide'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Summarize geometric validation
        if: ${{ always() }}
        run: |
          echo '## Deterministic pose guide (no generative model)' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json,pathlib; q=json.load(open("pose-guide-request.json")); p=pathlib.Path(q["output_dir"])/"metrics.json"; print("Missing report" if not p.exists() else "Geometry: "+str(json.loads(p.read_text()).get("status")))' >> "$GITHUB_STEP_SUMMARY"
