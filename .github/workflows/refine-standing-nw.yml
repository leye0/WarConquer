name: Fix NW full-body facing · Muse only
on:
  push:
    branches: [main]
    paths: ['standing-nw-fix-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standing-nw-muse-correction
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing PNG and cutout dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.16.2'
      - name: Validate NW-only request and original assets, no paid API call
        run: |
          python -m py_compile scripts/refine-standing-nw.py
          python scripts/refine-standing-nw.py --dry-run
      - name: Generate NW candidate with OpenRouter Muse once
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
        run: python scripts/refine-standing-nw.py
      - name: Commit NW candidate and comparison to main, even if any postprocessing fails
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/experiments/standing-turnaround/marches_hache
          if ! git diff --cached --quiet; then
            git commit -m 'art: NW axeman candidate with strict full-body direction'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nw-muse-raw
          path: nw-output/
          retention-days: 2
          if-no-files-found: ignore
