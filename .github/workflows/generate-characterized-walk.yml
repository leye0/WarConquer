name: Generate five characterized WarConquer walk frames · Muse
on:
  push:
    branches: [main]
    paths:
      - 'sprite-frame-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: five-characterized-muse-frames
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image libraries
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.16.2'
      - name: Verify pose characterization before any paid call
        shell: bash
        run: |
          python -m py_compile scripts/generate-characterized-walk.py
          python scripts/generate-characterized-walk.py --dry-run
      - name: Generate five independent frame PNGs with OpenRouter Muse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: python scripts/generate-characterized-walk.py
      - name: Commit any generated WarConquer PNGs to main, including partial success
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/spritesheets/drafts/marches_hache_side_walk ]]; then
            git add assets/spritesheets/drafts/marches_hache_side_walk
            if ! git diff --cached --quiet; then
              git commit -m 'art: add individually characterized Muse walk frames for review'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Preserve raw Muse images and pose guide crops for private QA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: five-frame-pose-debug
          path: sprite-frame-debug/
          retention-days: 2
          if-no-files-found: ignore
