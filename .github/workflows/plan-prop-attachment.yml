name: Prop grip · generic cheap vision attachment specifications

on:
  push:
    branches: [main]
    paths:
      - 'assets/experiments/props/marches_hache/trellis-v1/grip-request.json'
      - 'scripts/plan-prop-attachment.py'
      - '.github/workflows/plan-prop-attachment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prop-attachment-plan-v2
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check structure of generic vision planner
        run: python -m py_compile scripts/plan-prop-attachment.py
      - name: Reuse existing plan or make at most one cheap vision request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/plan-prop-attachment.py
      - name: Validate output and exact source file hashes
        run: python scripts/plan-prop-attachment.py --check
      - name: Preserve charged response even when semantic validation fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/experiments/props/marches_hache/trellis-v1
          if ! git diff --cached --quiet; then
            git commit -m 'assets: preserve paid vision response and accepted attachment plan'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-grip-plan
          path: assets/experiments/props/marches_hache/trellis-v1/grip-plan.json
          retention-days: 7
          if-no-files-found: ignore
