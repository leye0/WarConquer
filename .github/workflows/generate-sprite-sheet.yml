name: Generate sprite sheet · OpenRouter Muse
on:
  push:
    branches: [main]
    paths: ['sprite-sheet-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sprite-sheet-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2netp-v1
      - name: Install image utilities
        run: python -m pip install 'Pillow==11.3.0' 'rembg[cpu]==2.0.67' 'numpy==2.2.6' 'scipy==1.16.2'
      - name: Validate request without API cost
        run: python scripts/generate-sprite-sheet.py --dry-run
      - name: Download layout reference then generate via Muse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          OMP_NUM_THREADS: '1'
        run: python scripts/generate-sprite-sheet.py
      - name: Commit WarConquer draft PNG and review PNG directly to main
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d assets/spritesheets/drafts ]]; then
            git add assets/spritesheets/drafts
            if ! git diff --cached --quiet; then
              git commit -m 'art: Muse WarConquer sprite sheet draft'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sprite-sheet-debug
          path: sprite-output/
          retention-days: 2
          if-no-files-found: ignore
