name: Render HTML screenshot

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - '.github/workflows/render-html.yml'
      - 'scripts/render-html.mjs'
  workflow_dispatch:
    inputs:
      html_path:
        description: 'HTML file relative to repository root'
        required: true
        default: patate.html
        type: string

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Render changed HTML pages via one Chrome instance
        shell: bash
        env:
          HTML_PATH: ${{ inputs.html_path || 'patate.html' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            targets="$RUNNER_TEMP/render-targets.bin"
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
              fi
              git diff --name-only --diff-filter=ACMR -z "$BEFORE_SHA" HEAD -- '*.html' '*.htm' > "$targets"
            else
              git ls-files -z '*.html' '*.htm' > "$targets"
            fi
            if [[ ! -s "$targets" ]]; then printf '%s\0' 'patate.html' > "$targets"; fi
            node scripts/render-html.mjs --nul-list "$targets" renders
            echo "Rendered changed HTML files in a single Chrome session." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/render-html.mjs "$HTML_PATH" render.png
            printf '%s\n' "$HTML_PATH" > render-source.txt
            echo "Rendered \`$HTML_PATH\` to render.png" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: html-render
          path: |
            renders/
            render.png
            render-source.txt
          retention-days: 1
          if-no-files-found: error
