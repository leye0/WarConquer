name: Render HTML screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-html.yml'
      - 'scripts/render-html.mjs'
  workflow_dispatch:
    inputs:
      html_path:
        description: 'HTML file relative to repository root'
        required: true
        default: patate.html
        type: string

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Render HTML via native Chrome CDP
        env:
          HTML_PATH: ${{ inputs.html_path || 'patate.html' }}
        run: |
          node scripts/render-html.mjs "$HTML_PATH" render.png
          file render.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: html-render
          path: render.png
          retention-days: 1
          if-no-files-found: error
